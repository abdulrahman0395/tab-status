<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#1f1f23; --card:#2b2b31; --text:#ececf1; --muted:#9a9aa5; --accent:#ff5a1f; --line:#3a3a42; }
  * { box-sizing: border-box; }
  body { margin:0; width:300px; padding:14px; background:var(--bg); color:var(--text);
         font: 13px/1.4 "Segoe UI", Tahoma, sans-serif; }
  .current { font-size:12px; color:var(--muted); margin-bottom:8px; }
  .row { display:flex; gap:6px; }
  input { flex:1; min-width:0; background:var(--card); color:var(--text); border:1px solid var(--line);
          border-radius:8px; padding:7px 9px; font:inherit; outline:none; }
  input:focus { border-color:var(--accent); }
  button { font:inherit; cursor:pointer; border:none; border-radius:8px; }
  .primary { background:var(--accent); color:#fff; padding:7px 12px; }
  .ghost { background:var(--card); color:var(--text); border:1px solid var(--line); padding:7px 10px; }
  .ghost:hover { border-color:var(--accent); }
  .hint { font-size:11px; color:var(--muted); margin:6px 0 12px; display:flex; justify-content:space-between; }
  #flash { color:#7ee2a8; opacity:0; transition:opacity .2s; }
  #flash.show { opacity:1; }
  .label { font-size:11px; color:var(--muted); margin-bottom:6px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  .chip { display:flex; align-items:center; background:var(--card); border:1px solid var(--line);
          border-radius:999px; overflow:hidden; }
  .chip:hover { border-color:var(--accent); }
  .chip.active { border-color:var(--accent); background:rgba(255,90,31,.15); }
  .chip button { background:none; color:var(--text); }
  .chip .text { padding:5px 4px; }
  .chip .pin { padding:5px 4px 5px 0; padding-inline-start:9px; font-size:11px; opacity:.25; filter:grayscale(1); }
  .chip .pin:hover { opacity:.7; }
  .chip.pinned .pin { opacity:1; filter:none; }
  .chip .x { color:var(--muted); padding:5px 4px; padding-inline-end:9px; }
  .chip .x:hover { color:#ff8b8e; }
  .empty { font-size:12px; color:var(--muted); margin-bottom:12px; }
  .clear { width:100%; background:var(--card); color:var(--text); border:1px solid var(--line); padding:7px; }
  .clear:hover { border-color:#e5484d; color:#ff8b8e; }
  .upd { display:none; background:rgba(255,90,31,.12); border:1px solid rgba(255,90,31,.45);
         border-radius:10px; padding:9px 10px; margin-bottom:12px; }
  .upd-t { font-weight:600; margin-bottom:4px; }
  .upd-s { font-size:12px; color:var(--muted); margin-bottom:8px; line-height:1.6; }
  .upd-s code { color:var(--text); background:var(--card); padding:0 4px; border-radius:4px; }
  .upd-row { display:flex; align-items:center; gap:10px; }
  .upd-row a { color:var(--muted); font-size:12px; }
  .auto { display:flex; align-items:center; gap:8px; margin-top:10px; font-size:12px; color:var(--muted); cursor:pointer; }
  .auto input { appearance:none; flex:none; width:30px; height:17px; padding:0; border-radius:999px;
                background:var(--card); border:1px solid var(--line); position:relative; cursor:pointer; transition:background .15s; }
  .auto input::after { content:""; position:absolute; top:2px; inset-inline-start:2px; width:11px; height:11px;
                       border-radius:50%; background:var(--muted); transition:inset-inline-start .15s, background .15s; }
  .auto input:checked { background:var(--accent); border-color:var(--accent); }
  .auto input:checked::after { inset-inline-start:15px; background:#fff; }
  .err { color:#ff8b8e; font-size:12px; margin-top:8px; display:none; }
</style>
</head>
<body>
  <div class="upd" id="upd">
    <div class="upd-t">فيه نسخة جديدة <b id="upd-v"></b></div>
    <div class="upd-s">1. دبل كليك على <code>update.bat</code> في فولدر الإكستنشن<br>2. وبعدين دوس هنا:</div>
    <div class="upd-row"><button class="primary" id="upd-reload">حدّث دلوقتي</button>
    <a id="upd-link" target="_blank" rel="noopener">إيه الجديد؟</a></div>
  </div>
  <div class="current" id="current"></div>
  <div class="row">
    <input id="custom" dir="auto" placeholder="اكتب حالة…" maxlength="40">
    <button class="primary" id="set" title="حطها على التاب (Enter)">حفظ</button>
    <button class="ghost" id="add" title="ضيفها للقائمة بس من غير ما تحطها على التاب (Ctrl+Enter)">＋</button>
  </div>
  <div class="hint"><span>＋ تضيفها للقائمة بس (<bdi>Ctrl+Enter</bdi>)</span><span id="flash"></span></div>
  <div id="lists"></div>
  <button class="clear" id="clear">امسح حالة التاب دي</button>
  <label class="auto" title="سكريبت في الصفحة (زي userscript) يقدر يحط الحالة لوحده لما حاجة تبدأ أو تخلص">
    <input type="checkbox" id="auto"> حالة تلقائية من سكريبتات الصفحة</label>
  <div class="err" id="err">مش هينفع في الصفحة دي (صفحات المتصفح الداخلية ومتجر الإكستنشنز ممنوعة).</div>
  <script src="popup.js"></script>
</body>
</html>
